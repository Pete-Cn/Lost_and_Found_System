<!DOCTYPE html>
<html>
{% load static %}

<head>
  <title>{% block title %} {% endblock %}</title>

  <link rel="stylesheet" href="{% static '\bootstrap-5.3.0-alpha1-dist\css\bootstrap.min.css' %}">
  <script src="{% static '\bootstrap-5.3.0-alpha1-dist\js\bootstrap.bundle.min.js' %}"></script>
  <link rel="stylesheet" href="{% static '\css\main.css' %}">
  {% block head %} {% endblock %}

</head>

<body class="container-fluid w-100 p-0">
  <nav class="navbar navbar-expand-lg bg-light rounded mb-5">
  <div class="container-fluid px-5 py-2">
    <button class="navbar-toggler collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#navbar1"
      aria-controls="navbar1" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="navbar-collapse d-lg-flex collapse" id="navbar1">
      <ul class="navbar-nav col-lg-4 justify-content-lg-starter">
        <li class="nav-item"><a href="{% url 'board:index' %}" class="nav-link">首页</a></li>
        <li class="nav-item"><a href="{% url 'items:item' %}" class="nav-link">寻物</a></li>
        <li class="nav-item"><a href="{% url 'items:post_page' %}" class="nav-link">寻主</a></li>
        <li class="nav-item"><a href="{% url 'board:report_page' %}" class="nav-link">反馈版</a></li>
      </ul>
        <div class="col-lg-3"></div>
      <div class="d-lg-flex col-lg-5 justify-content-lg-end me-5">
        {% if request.user.is_authenticated %}
        <div class="me-2 btn text-end">
          <a href="{% url 'profile' request.user.id %}">{{ request.user.username }}</a>
        </div>
        <a href="{% url 'logout' %}"><button type="button" class="btn btn-outline-primary me-2">注销</button></a>
        {% else %}
        <a href="{% url 'login' %}"><button type="button" class="btn btn-outline-primary me-2">登录</button></a>
        <a href="{% url 'signup' %}" onclick="openwindow()"><button type="button"
            class="btn btn-primary">注册</button></a>
        {% endif %}

      </div>
    </div>
  </div>
</nav>
  <div class="container-lg d-flex w-100">

    {% block body %}
    {% endblock %}
  </div>
  <footer class="py-3 my-4 footer">
    <ul class="nav justify-content-center border-bottom pb-3 mb-3">
    </ul>
    <p class="text-center text-muted">© 2024 <a href="https://github.com/Pete-Cn">Pete_w</a> of ustc</p>
  </footer>


</body>

</html>
